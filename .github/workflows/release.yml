name: Publish to crates.io
on:
    push:
        tags: ["v*"] # Triggers when pushing tags starting with 'v'
jobs:
    publish:
        runs-on: ubuntu-latest
        environment: release # Optional: for enhanced security
        permissions:
            contents: write
            id-token: write # Required for OIDC token exchange
        steps:
            - uses: actions/checkout@v6
            - uses: rust-lang/crates-io-auth-action@v1
              id: auth
            - run: |
                  cargo publish && exit 0
                  crate="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0] | "\(.name)/\(.version)"')"
                  curl --fail --silent --output /dev/null --retry 3 --user-agent "$GITHUB_REPOSITORY release workflow" "https://crates.io/api/v1/crates/$crate"
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
            - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
              env:
                  GH_TOKEN: ${{ github.token }}
